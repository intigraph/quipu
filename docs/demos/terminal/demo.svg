<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Quipu | turn a note into a queryable graph</title>
<desc id="desc">A local episode becomes a graph, then a query finds its relationship. No model or server is used. The animation repeats. The adjacent transcript provides a static alternative.</desc>
<rect width="100%" height="100%" rx="16" fill="#101827"/>
<path d="M0 54H1000" stroke="#334155"/>
<circle cx="28" cy="27" r="7" fill="#fb7185"/>
<circle cx="52" cy="27" r="7" fill="#fbbf24"/>
<circle cx="76" cy="27" r="7" fill="#34d399"/>
<text x="110" y="34" fill="#e2e8f0" font-family="monospace" font-size="20">Quipu | turn a note into a queryable graph</text>
<g id="frame0" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="visible;hidden;hidden" keyTimes="0.000000;0.500000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu episode episode.json --base-ns urn:demo: --timestamp </text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">2026-01-01T00:00:00Z --db demo.db</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">ingested episode &quot;demo&quot; -- 14 facts (tx 1)</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">automatic embedding unavailable: no model and tokenizer </text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">configured; graph loading is not semantic-index readiness</text>
</g>
<g id="frame1" visibility="visible" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;visible" keyTimes="0.000000;0.500000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu read &#x27;SELECT ?person ?thing WHERE { ?person </text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">&lt;urn:demo:studies&gt; ?thing }&#x27; --db demo.db</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">person  thing</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">----------------------------------------</text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">urn:demo:Ada    urn:demo:Engine</text>
<text x="28" y="254" fill="#f1f5f9" xml:space="preserve"></text>
<text x="28" y="286" fill="#f1f5f9" xml:space="preserve">1 results</text>
</g>
</svg>
