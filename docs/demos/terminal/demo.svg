<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Quipu | insert a fact, watch the graph change</title>
<desc id="desc">Two plain Turtle facts are knotted into a local store and queried; the earlier version is then read back by transaction. No model or server is used. The animation repeats. The adjacent transcript provides a static alternative.</desc>
<rect width="100%" height="100%" rx="16" fill="#101827"/>
<path d="M0 54H1000" stroke="#334155"/>
<circle cx="28" cy="27" r="7" fill="#fb7185"/>
<circle cx="52" cy="27" r="7" fill="#fbbf24"/>
<circle cx="76" cy="27" r="7" fill="#34d399"/>
<text x="110" y="34" fill="#e2e8f0" font-family="monospace" font-size="20">Quipu | insert a fact, watch the graph change</text>
<g id="frame0" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="visible;hidden;hidden" keyTimes="0.000000;0.125000;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ cat ada.ttl</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">@prefix : &lt;urn:demo:&gt; .</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">:Ada :studies :Engine .</text>
</g>
<g id="frame1" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.125000;0.250000;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu knot ada.ttl --db demo.db</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">knotted 1 facts from ada.ttl (tx 1)</text>
</g>
<g id="frame2" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.250000;0.416667;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu read &#x27;SELECT ?who ?what WHERE { ?who &lt;urn:demo:studies&gt; </text>
<text x="28" y="126" fill="#6ee7b7" xml:space="preserve">?what }&#x27; --db demo.db</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">who     what</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">----------------------------------------</text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">urn:demo:Ada    urn:demo:Engine</text>
<text x="28" y="254" fill="#f1f5f9" xml:space="preserve"></text>
<text x="28" y="286" fill="#f1f5f9" xml:space="preserve">1 results</text>
</g>
<g id="frame3" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.416667;0.541667;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ cat babbage.ttl</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">@prefix : &lt;urn:demo:&gt; .</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">:Babbage :designed :Engine .</text>
</g>
<g id="frame4" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.541667;0.666667;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu knot babbage.ttl --db demo.db</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">knotted 1 facts from babbage.ttl (tx 2)</text>
</g>
<g id="frame5" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.666667;0.833333;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu read &#x27;SELECT ?s ?p ?o WHERE { ?s ?p ?o }&#x27; --db demo.db</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">s       p       o</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">------------------------------------------------------------</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">urn:demo:Ada    urn:demo:studies        urn:demo:Engine</text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">urn:demo:Babbage        urn:demo:designed       urn:demo:Engine</text>
<text x="28" y="254" fill="#f1f5f9" xml:space="preserve"></text>
<text x="28" y="286" fill="#f1f5f9" xml:space="preserve">2 results</text>
</g>
<g id="frame6" visibility="visible" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;visible" keyTimes="0.000000;0.833333;1.000000" dur="24.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ quipu read &#x27;SELECT ?s ?p ?o WHERE { ?s ?p ?o }&#x27; --tx 1 --db </text>
<text x="28" y="126" fill="#6ee7b7" xml:space="preserve">demo.db</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">s       p       o</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">------------------------------------------------------------</text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">urn:demo:Ada    urn:demo:studies        urn:demo:Engine</text>
<text x="28" y="254" fill="#f1f5f9" xml:space="preserve"></text>
<text x="28" y="286" fill="#f1f5f9" xml:space="preserve">1 results</text>
</g>
</svg>
