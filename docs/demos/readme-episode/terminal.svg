<rect width="876" height="596" rx="10" fill="#14141f"/>
<rect width="876" height="32" rx="10" fill="#20203a"/><rect y="22" width="876" height="10" fill="#20203a"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="438.0" y="21" fill="#8b8fa8" text-anchor="middle" style="font-size:12px">quipu 0.16.1: an agent records an episode</text>
<clipPath id="term"><rect x="0" y="34" width="876" height="562"/></clipPath>
<g clip-path="url(#term)"><g class="screen">
<text class="l0" x="18" y="60" fill="#8b8fa8"># An agent traced one checkout request and records what it saw.</text>
<clipPath id="k1"><rect class="c1" x="18" y="64" height="19" width="882.0"/></clipPath>
<text class="l1" x="18" y="79" clip-path="url(#k1)"><tspan fill="#ffc24d">$ </tspan><tspan fill="#f2f2f7">qp episode trace.json --base-ns https://example.org/shop/ --timestamp 2026-01-05T09:00:00Z --db shop.db</tspan></text>
<text class="l2" x="18" y="98" fill="#d6d7e6">ingested episode &quot;checkout-trace-1107&quot; -- 25 facts (tx 1)</text>
<text class="l3" x="18" y="117" fill="#d6d7e6"></text>
<text class="l4" x="18" y="136" fill="#8b8fa8"># It guesses a cache exists, with no description. The rule refuses it.</text>
<clipPath id="k5"><rect class="c5" x="18" y="140" height="19" width="436.8"/></clipPath>
<text class="l5" x="18" y="155" clip-path="url(#k5)"><tspan fill="#ffc24d">$ </tspan><tspan fill="#f2f2f7">qp knot guess.ttl --shapes shapes.ttl --db shop.db</tspan></text>
<text class="l6" x="18" y="174" fill="#ff6b6b">SHACL validation failed: 1 violation(s)</text>
<text class="l7" x="18" y="193" fill="#ff6b6b">  Violation on https://example.org/shop/cache: a service needs a description</text>
<text class="l8" x="18" y="212" fill="#d6d7e6"></text>
<text class="l9" x="18" y="231" fill="#8b8fa8"># Any agent can read it back with its source. $CALLS: who calls whom, from where.</text>
<clipPath id="k10"><rect class="c10" x="18" y="235" height="19" width="260.4"/></clipPath>
<text class="l10" x="18" y="250" clip-path="url(#k10)"><tspan fill="#ffc24d">$ </tspan><tspan fill="#f2f2f7">qp read &quot;$CALLS&quot; --db shop.db</tspan></text>
<text class="l11" x="18" y="269" fill="#d6d7e6">service calls   source</text>
<text class="l12" x="18" y="288" fill="#d6d7e6">------------------------------------------------------------</text>
<text class="l13" x="18" y="307" fill="#d6d7e6">&quot;checkout&quot;      &quot;orders&quot;        &quot;trace 1107&quot;</text>
<text class="l14" x="18" y="326" fill="#d6d7e6">&quot;checkout&quot;      &quot;payments&quot;      &quot;trace 1107&quot;</text>
<text class="l15" x="18" y="345" fill="#d6d7e6"></text>
<text class="l16" x="18" y="364" fill="#d6d7e6">2 results</text>
<text class="l17" x="18" y="383" fill="#d6d7e6"></text>
<text class="l18" x="18" y="402" fill="#8b8fa8"># Time is part of every fact. $BEFORE: the same question, before the trace.</text>
<clipPath id="k19"><rect class="c19" x="18" y="406" height="19" width="537.6"/></clipPath>
<text class="l19" x="18" y="421" clip-path="url(#k19)"><tspan fill="#ffc24d">$ </tspan><tspan fill="#f2f2f7">qp read &quot;$BEFORE&quot; --valid-at 2026-01-04T00:00:00Z --db shop.db</tspan></text>
<text class="l20" x="18" y="440" fill="#d6d7e6">service calls</text>
<text class="l21" x="18" y="459" fill="#d6d7e6">----------------------------------------</text>
<text class="l22" x="18" y="478" fill="#d6d7e6"></text>
<text class="l23" x="18" y="497" fill="#d6d7e6">0 results</text>
</g></g>
</svg>
