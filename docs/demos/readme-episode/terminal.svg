<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 596" role="img" aria-label="A terminal recording of quipu 0.16.1. An agent records a traced checkout request as an episode with its source; a guessed service with no description is refused by a rule; a query returns each dependency with the trace it came from; and a read at a time before the trace returns nothing.">
