# The SHIPPED browser bundle: the wasm half of the book's "Explore this
# repository's graph" page (aegis-tpqccc).
#
# Deliberately separate from `wasm/harness`, which is an acceptance/bench
# harness. Its exported surface is the page's API rather than test scenarios.
# Startup and interactive queries also need speed: shrinking the binary at the
# expense of tens of seconds of worker CPU made the page impractical.
#
# Not a member of any workspace: it only ever builds for wasm32
# (`.cargo/config.toml` pins the target), while the parent crate's tests,
# benches and binaries only build natively.
[package]
name = "quipu-wasm-explorer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Browser features are explicit: native networking and ONNX remain separate.
quipu = { package = "quipu-ai", path = "../..", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
# Writing the export archive in the tab, with the same crates the reader uses,
# so what comes out is the same .pendant.tar.gz shape that goes in.
tar = "0.4"
flate2 = "1"

[features]
default = ["shacl", "owl", "reactive-reasoner"]
# Passthroughs keep reported capabilities aligned with the linked engine.
shacl = ["quipu/shacl"]
owl = ["quipu/owl"]
reactive-reasoner = ["quipu/reactive-reasoner"]

[profile.release]
# Optimize the actual receiver and query engine for latency. LTO and stripping
# still limit download size; acceptance measures both bytes and cold startup.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
