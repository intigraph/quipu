name: Installer controls
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
# Superseded PR runs are cancelled (aegis-9w9l, runner starvation); main
# pushes and dispatches keep one group per run and are never cancelled.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate standalone entrypoint and refusal controls
        run: |
          sh -n install.sh
          python3 scripts/test-install-release.py
