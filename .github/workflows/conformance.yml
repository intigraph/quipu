name: Conformance

# Expected outcomes are stable source. Measurements, timings and source stamps
# belong to the run/release artifacts; this workflow never commits them.
on:
  # Required CI calls this on every PR, main push and combined queue tree.
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to measure and publish
        required: true
        type: string

concurrency:
  group: conformance-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  expected-controls:
    name: Conformance expectation controls
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 -m unittest discover -s benchmark/public -p 'test_*.py'
      - run: python3 scripts/test-stage-conformance-release.py

  re-run-conformance:
    name: Re-derive conformance from the pinned W3C suite
    needs: expected-controls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Checkout the expected-results suite pins
        run: |
          set -euo pipefail
          rdf=$(python3 -c 'import json; print(json.load(open("benchmark/public/expected-results.json"))["suites"]["sparql11-evaluation.json"]["suite_revision"])')
          shacl=$(python3 -c 'import json; print(json.load(open("benchmark/public/expected-results.json"))["suites"]["shacl-core.json"]["suite_revision"])')
          git clone --quiet https://github.com/w3c/rdf-tests /tmp/rdf-tests
          git -C /tmp/rdf-tests checkout --quiet "$rdf"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/w3c/data-shapes /tmp/data-shapes
          git -C /tmp/data-shapes sparse-checkout set data-shapes-test-suite
          git -C /tmp/data-shapes checkout --quiet "$shacl"
      - name: Build the measured binaries
        run: cargo build --release --bin quipu --bin quipu-server --bin quipu-shacl-conformance --features shacl,onnx,server,dev-tools
      - name: Derive and enforce every pass and known failure
        env:
          CONFORMANCE_RELEASE_TAG: ${{ inputs.release_tag }}
          CONFORMANCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/conformance-python
          /tmp/conformance-python/bin/pip install --quiet rdflib==7.6.0
          target=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          /tmp/conformance-python/bin/python benchmark/public/derive_expected.py \
            --rdf-suite /tmp/rdf-tests --shacl-suite /tmp/data-shapes \
            --quipu "$target/release/quipu" --shacl "$target/release/quipu-shacl-conformance" \
            --output /tmp/conformance-run
      - name: Retain exact measurements and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-run-${{ github.sha }}
          path: /tmp/conformance-run/
          if-no-files-found: warn
          retention-days: 90
      - name: Package release-only report
        if: github.event_name == 'workflow_dispatch'
        run: |
          tar -czf /tmp/conformance-report.tar.gz -C /tmp/conformance-run/report .
          cd /tmp
          sha256sum conformance-report.tar.gz > conformance-report.tar.gz.sha256
      - name: Retain release publication input
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-conformance-report
          path: /tmp/conformance-report.tar.gz*
