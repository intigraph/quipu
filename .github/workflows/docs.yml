name: Docs

# The two path lists are duplicated on purpose: GitHub Actions does not
# support YAML anchors in workflow files, so an alias here would not expand.
# Keep them identical.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
      # The 3D Datalinks demo is published from ui/ sources, staged into the
      # book by `just docs-assets`. Without this the page silently goes stale
      # whenever the renderer changes.
      - 'ui/**'
      - 'scripts/stage-datalinks.sh'
      - 'scripts/smoke-datalinks.cjs'
      - 'scripts/select-explorer-release.py'
      - 'scripts/test-select-explorer-release.py'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
      - 'ui/**'
      - 'scripts/stage-datalinks.sh'
      - 'scripts/smoke-datalinks.cjs'
      - 'scripts/select-explorer-release.py'
      - 'scripts/test-select-explorer-release.py'
  workflow_dispatch:

# Superseded PR runs share a group; every non-PR run keeps its own group.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid

      # Package the committed text share and copy the renderer. No Rust.
      - name: Test explorer release selection
        run: python3 scripts/test-select-explorer-release.py

      - name: Stage Datalinks demo assets
        run: scripts/stage-datalinks.sh

      # The "Explore this repository's graph" page (aegis-tpqccc) runs quipu
      # compiled to wasm and imports the release's own knowledge pack. Both are
      # RELEASE ASSETS, downloaded here rather than committed — so the repo stays
      # source-only and this build still needs no Rust.
      #
      # They are staged INTO the site rather than fetched by the page at runtime
      # because a browser cannot fetch them: GitHub serves release-asset
      # downloads with no `Access-Control-Allow-Origin` header, so `fetch()` from
      # scbrown.github.io is refused before the response is readable. Measured in
      # a real browser from the real Pages origin, 2026-09-05 — via github.com,
      # via /releases/latest/download, and via the api.github.com asset endpoint,
      # which 302s to the same non-CORS host. Do not "simplify" this away by
      # pointing the page at a release URL; it will fail silently for readers and
      # work for whoever tests it with curl.
      #
      # A release may publish before its trusted pack arrives. Select the newest
      # complete public release instead; never deploy a packless explorer.
      - name: Stage explorer assets from the newest release with a complete pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEST=docs/book/src/explore
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" | jq -s . > "$TMP/releases.json"
          python3 scripts/select-explorer-release.py < "$TMP/releases.json" > "$TMP/selected.json"
          TAG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$TMP/selected.json")
          PACK=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["pack"])' "$TMP/selected.json")
          WASM=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["wasm"])' "$TMP/selected.json")
          PUBLISHED=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["published"])' "$TMP/selected.json")
          echo "Staging complete explorer release $TAG"
          echo "EXPLORER_RELEASE_PUBLISHED_AT=$PUBLISHED" >> "$GITHUB_ENV"
          for ASSET in "$PACK" "$WASM"; do
            gh release download "$TAG" --pattern "$ASSET" --pattern "$ASSET.sha256" --dir "$TMP"
            (cd "$TMP" && sha256sum --check "$ASSET.sha256")
          done
          mkdir -p "$DEST/pkg"
          tar -C "$TMP" -xzf "$TMP/$WASM"
          find "$TMP" -name 'quipu_wasm_explorer*' -exec cp {} "$DEST/pkg/" \;
          for RUNTIME in "$TMP"/*-wasm/runtime; do
            if [ -d "$RUNTIME" ]; then cp -R "$RUNTIME" "$DEST/pkg/"; fi
          done
          cp "$TMP/$PACK" "$DEST/repository.pendant.tar.gz"
          for FILE in pkg/quipu_wasm_explorer.js pkg/quipu_wasm_explorer_bg.wasm repository.pendant.tar.gz; do
            test -s "$DEST/$FILE" || { echo "missing staged explorer asset: $FILE"; exit 1; }
          done

      - name: Build book
        run: mdbook build docs/book

      - name: Verify the demo was published
        run: |
          for f in index.html load-demo.js demo.pendant.tar.gz pendant/manifest.json \
                   pendant/export.nt pendant/shapes.ttl datalinks.js graph-canvas.js \
                   vendor/three.module.min.js; do
            test -s "docs/book/book/datalinks/$f" \
              || { echo "missing from book output: datalinks/$f"; exit 1; }
          done

      - name: Require the shared Quipu runtime for Datalinks
        run: |
          for f in worker.js pkg/quipu_wasm_explorer.js pkg/quipu_wasm_explorer_bg.wasm; do
            test -s "docs/book/book/explore/$f" || { echo "missing Quipu runtime: $f"; exit 1; }
          done

      # The page's own sources are committed, so they must ALWAYS be published —
      # that half is a hard failure. The staged release artifacts are conditional
      # (see the staging step), so they are checked only when staging produced
      # them: a page published without its wasm is a real state, and it tells the
      # reader so rather than pretending.
      - name: Verify the explorer page was published
        run: scripts/check-explorer-published.sh

      - name: Verify Datalinks in a browser
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/smoke-datalinks.cjs

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          # `docs/book/book`, not `docs/book/book/html`: mdbook nests output
          # under a per-renderer directory only when SEVERAL renderers are
          # registered. book.toml used to register linkcheck as a second one,
          # which is why the old path had /html on it.
          path: docs/book/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
