name: Release PR freshness

# aegis-0zr: the open release PR is re-checked against main whenever either side
# moves, and the verdict is posted as the "Release PR freshness" status on the
# exact PR head that was checked.
#
# - A push to main can make the open release PR stale.
# - A new or regenerated release PR head needs its own verdict. release-plz and the
#   release-pr-daily correction push with RELEASE_PLZ_TOKEN, so those pushes raise
#   pull_request events (a GITHUB_TOKEN push would not).
#
# Its own workflow, not a release.yml job: release.yml runs only on pushes to main,
# so a regenerated PR head never got a verdict there (#910 review).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

# One check at a time PER SOURCE, newest wins. Not cancel-in-progress: a cancelled
# run would leave nothing on the PR head, while a queued newer run supersedes the
# older one. GitHub keeps one pending run per group and cancels the one it replaces,
# so the group is keyed by event and head ref. With a single shared group, ANY pull
# request into main (its job skipped) or a release-PR regeneration could replace a
# pending main-push run, leaving the release PR's old success standing after main
# moved: a stale success (#910 review). Successive pushes to main still supersede
# each other, and successive heads of the same release PR do too.
concurrency:
  group: release-pr-freshness-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-pr-freshness:
    # Not named "Release PR freshness": on a pull_request run the job's own check
    # would sit on the PR head beside the status of that name and could disagree.
    name: Check release PR freshness
    # No job-level `if:`. A job skipped on every ordinary PR leaves a skipped check
    # the merge gate cannot prove (#910 review). The scope test is the first step,
    # and every later step runs only in scope: an ordinary or fork PR's run ends
    # green having checked out, read and written nothing. Only same-repository
    # release-plz branches are in scope; a fork PR named release-plz-* gets no say
    # in the verdict (and GitHub gives fork PRs a read-only token regardless).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Scope
        id: scope
        env:
          IN_SCOPE: >-
            ${{ github.event_name == 'push' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
             startsWith(github.event.pull_request.head.ref, 'release-plz')) }}
        run: |
          set -euo pipefail
          case "$IN_SCOPE" in
            true) echo "in_scope=true" >> "$GITHUB_OUTPUT" ;;
            false) echo "in_scope=false" >> "$GITHUB_OUTPUT"
                   echo "Not a push to main or a same-repository release PR; nothing to check." ;;
            *) echo "::error::Unexpected scope value '$IN_SCOPE'."; exit 1 ;;
          esac
      # Always main's code and main's tree: the PR head is fetched as data below and
      # none of its scripts run.
      - uses: actions/checkout@v4
        if: steps.scope.outputs.in_scope == 'true'
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.in_scope == 'true'
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.in_scope == 'true'
        with:
          tool: git-cliff
      - name: Check the open release PR against current main
        if: steps.scope.outputs.in_scope == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The main this run checks against: the pushed commit, or main as checked
          # out now for a pull_request event.
          BASE="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            listed="${PR_HEAD_REF} ${PR_HEAD_SHA} ${PR_NUMBER}"
          # Same-repository PRs into main only, every page of them; more than one
          # release PR is ambiguous, not "the first one".
          elif ! listed="$(gh pr list --state open --base main --limit 1000 \
            --json headRefName,headRefOid,number,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("release-plz")))] | if length > 1 then "MULTIPLE" else (.[0] // {} | "\(.headRefName // "") \(.headRefOid // "") \(.number // "")") end')"; then
            echo "::error::Could not discover the open release PR; freshness is unknown."
            exit 1
          fi
          if [ "$listed" = MULTIPLE ]; then
            echo "::error::More than one open release PR; freshness is ambiguous."
            exit 1
          fi
          read -r BR OID NUM <<< "$listed" || true
          if [ -z "${BR:-}${OID:-}${NUM:-}" ]; then
            echo "No open release PR — nothing to check."
            exit 0
          fi
          if [[ "$BR" != release-plz* || ! "$OID" =~ ^[0-9a-f]{40}$ || ! "$NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid release PR discovery response; freshness is unknown."
            exit 1
          fi
          # Check the exact commit that was listed, not the mutable branch name: a
          # regeneration between the list and the fetch would otherwise check one
          # proposal and publish the verdict on another.
          git fetch --quiet origin "${OID}" || { echo "::error::could not fetch ${BR} @ ${OID::8}"; exit 1; }
          if [ "$(git rev-parse FETCH_HEAD)" != "$OID" ]; then
            echo "::error::fetched ${BR} does not match listed ${OID::8}; not checking"
            exit 1
          fi
          rc=0; ./scripts/release-pr-freshness.sh "$OID" "$BASE" || rc=$?
          case "$rc" in
            0) state=success; desc="Covers every packaged commit on main at ${BASE::8}" ;;
            1) state=failure; desc="Stale: main ${BASE::8} has packaged commits this release does not list" ;;
            *) state=error;   desc="Could not check against main ${BASE::8} (exit ${rc})" ;;
          esac
          # Publish only if nothing moved while we checked. If main advanced, its push
          # run owns the verdict; if the PR was regenerated, its pull_request run does.
          if ! now_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" ||
             ! now_head="$(gh pr view "$NUM" --json headRefOid --jq .headRefOid)"; then
            echo "::error::Could not reread main and the release PR; not publishing a verdict."
            exit 1
          fi
          if [[ ! "$now_main" =~ ^[0-9a-f]{40}$ || ! "$now_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid current revision response; not publishing a verdict."
            exit 1
          fi
          if [ "$now_main" != "$BASE" ] || [ "$now_head" != "$OID" ]; then
            echo "main or the release PR moved during the check (main ${now_main::8}, PR ${now_head::8}); not publishing this verdict."
            exit 0
          fi
          # The status binds to the exact PR head that was checked.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${OID}" -f state="$state" \
            -f context="Release PR freshness" -f description="$desc" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "Release PR #${NUM} (${BR} @ ${OID::8}): ${state} — ${desc}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$state" = failure ]; then
            echo "::warning title=Release PR #${NUM} is stale::${desc}. Do not merge it until it is regenerated."
            if ! busy="$(gh run list --workflow release-pr-daily.yml --json status \
                --jq '[.[] | select(.status != "completed")] | length')" ||
               [[ ! "$busy" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not read release-pr-daily runs; not requesting a regeneration blindly."
              exit 1
            fi
            if [ "$busy" -eq 0 ]; then
              # Not `cmd && echo`: errexit ignores a failure there, and a stale PR
              # whose regeneration was never requested must not end green.
              if ! gh workflow run release-pr-daily.yml --ref main; then
                echo "::error::Could not request a regeneration (release-pr-daily.yml); nothing will refresh the stale release PR."
                exit 1
              fi
              echo "Requested one regeneration (release-pr-daily.yml)."
            else
              echo "A release-pr-daily run is already queued or running; not requesting another."
            fi
          fi
          [ "$state" != error ] || exit 1
