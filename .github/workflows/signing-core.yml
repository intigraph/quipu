name: Shared signing core

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled (aegis-9w9l, runner starvation); main
# pushes and dispatches keep one group per run and are never cancelled.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Shared signing native and Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --manifest-path crates/quipu-signing/Cargo.toml --check
      - run: cargo test --locked --manifest-path crates/quipu-signing/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/quipu-signing/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --locked --manifest-path crates/quipu-signing/Cargo.toml --target wasm32-unknown-unknown --lib
