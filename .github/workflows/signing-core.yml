name: Shared signing core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Shared signing native and Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --manifest-path crates/quipu-signing/Cargo.toml --check
      - run: cargo test --locked --manifest-path crates/quipu-signing/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/quipu-signing/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --locked --manifest-path crates/quipu-signing/Cargo.toml --target wasm32-unknown-unknown --lib
