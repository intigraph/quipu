name: Release CI readiness rearm

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
    branches: [main]

# Both completion orders share a lock. This workflow never publishes anything.
concurrency:
  group: release-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rearm:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run is privileged: use trusted default-branch code, never an
      # artifact or a checkout supplied by the triggering workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rearm only a deferred current-main release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/rearm_release_correctness.py "$HEAD_SHA"
