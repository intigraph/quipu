name: Nix build

on:
  pull_request:
    paths: ["flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock", "src/**", "crates/**", ".github/workflows/nix.yml"]
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock", "src/**", "crates/**", ".github/workflows/nix.yml"]

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build quipu
        run: nix build --print-build-logs
      - name: Check quipu --help
        run: ./result/bin/quipu --help
