name: Nix build

on:
  pull_request:
    paths: ["flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock", "src/**", "crates/**", ".github/workflows/nix.yml"]
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock", "src/**", "crates/**", ".github/workflows/nix.yml"]

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'quipu-pr-runner-1' || format('quipu-build-{0}-{1}-{2}-{3}', github.workflow, github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build quipu
        run: nix build --print-build-logs
      - name: Check quipu --help
        run: ./result/bin/quipu --help
