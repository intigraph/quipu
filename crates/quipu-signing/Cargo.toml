[package]
name = "quipu-signing"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared Quipu v1 verdict signing primitives; trust and keys remain caller-owned"
repository = "https://github.com/intigraph/quipu"
# Published to crates.io (first release 0.1.0 approved by Stiwi 2026-10-29, aegis-ulk
# option A). Published by hand from the merged commit; it is not in the root workspace
# or the release-plz lane.

[workspace]

[dependencies]
hex = "0.4"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
